<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}
body {
  background: #0f172a;
  color: white;
}
/* ===== Page Handling ===== */
.page {
  display: none;
  min-height: 100vh;
  padding: 20px;
}
.page:target,
#home {
  display: block;
}
h1 {
  text-align: center;
  margin-bottom: 20px;
}
/* ===== GRID ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr); /* Desktop: 4 in one row */
  gap: 15px;
}
/* Tablet */
@media (max-width: 900px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
/* Mobile */
@media (max-width: 480px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .card {
    padding: 20px;
  }
  .icon {
    font-size: 28px;
  }
}
/* ===== CARDS ===== */
.card {
  position: relative;
  background: #1e293b;
  border-radius: 16px;
  padding: 25px;
  min-height: 120px;
  text-align: center;
  text-decoration: none;
  color: white;
  cursor: pointer;
  transition: 0.3s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.card:hover {
  background: #334155;
  transform: scale(1.05);
}
.icon {
  font-size: 36px;
  margin-bottom: 10px;
}
/* ===== TYPE BADGE ===== */
.badge {
  position: absolute;
  top: 10px;
  left: 10px;
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 0.5px;
  padding: 3px 7px;
  border-radius: 6px;
  text-transform: uppercase;
}
.badge.web {
  background: rgba(56, 189, 248, 0.15);
  color: #38bdf8;
  border: 1px solid #38bdf8;
}
.badge.apk {
  background: rgba(74, 222, 128, 0.15);
  color: #4ade80;
  border: 1px solid #4ade80;
}
.badge svg {
  width: 11px;
  height: 11px;
}
/* ===== SUB PAGE ===== */
.subpage {
  text-align: center;
}
.back {
  display: inline-block;
  margin-top: 20px;
  color: #38bdf8;
  text-decoration: none;
  font-size: 16px;
}
</style>
</head>
