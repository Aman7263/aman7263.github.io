<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Library | Production Suite</title>
  <!-- SEO metadata -->
  <meta name="description" content="Aman Aryan's personal project site with blog posts, investment tools, and analytics-driven resources.">
  <meta name="keywords" content="Aman Aryan, blog, investment analyzer, AI dashboard, portfolio, contact, privacy, disclaimer">
  <meta name="author" content="Aman Aryan">
  <meta name="robots" content="index, follow">
  <meta name="google-site-verification" content="YOUR_GOOGLE_SEARCH_CONSOLE_CODE">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SVF6G890F8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SVF6G890F8');

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d1a;
            --card: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --accent: #7c5cfc;
            --accent2: #e040fb;
            --text: #f0f0f5;
            --muted: rgba(255,255,255,0.45);
            --success: #00d68f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── HEADER ── */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.4rem 2.5rem;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(13,13,26,0.85);
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .top-bar-actions { display: flex; gap: 0.8rem; align-items: center; }

        .btn {
            padding: 0.55rem 1.2rem;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: #6a4aed; transform: translateY(-1px); }
        .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
        .btn-ghost:hover { background: rgba(255,255,255,0.08); }

        /* ── HERO ── */
        .hero {
            padding: 3.5rem 2.5rem 2rem;
            max-width: 1300px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 40%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .hero p { color: var(--muted); font-size: 1rem; }

        /* ── STATS BAR ── */
        .stats-bar {
            display: flex;
            gap: 1.5rem;
            padding: 1rem 2.5rem;
            max-width: 1300px;
            margin: 0 auto 1.5rem;
        }

        .stat-chip {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            color: var(--muted);
        }

        .stat-chip span { color: #fff; font-weight: 700; margin-right: 0.3rem; }

        /* ── FILTER BAR ── */
        .filter-bar {
            max-width: 1300px;
            margin: 0 auto 2rem;
            padding: 0 2.5rem;
            display: flex;
            gap: 0.7rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.4rem 1rem;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ── GRID ── */
        .songs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 1.5rem;
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 2.5rem 4rem;
        }

        /* ── CARD ── */
        .song-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .song-card:hover {
            transform: translateY(-4px);
            border-color: rgba(124,92,252,0.4);
            box-shadow: 0 12px 40px rgba(124,92,252,0.15);
        }

        .card-cover {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            cursor: pointer;
        }

        .card-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }

        .song-card:hover .card-cover img { transform: scale(1.04); }

        .cover-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%);
            display: flex;
            align-items: flex-end;
            padding: 1rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .song-card:hover .cover-overlay { opacity: 1; }

        .expand-icon {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            border: none;
            color: #fff;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        /* ── TAGS (Tone / Language) ── */
        .tag-row {
            position: absolute;
            top: 0.8rem;
            left: 0.8rem;
            display: flex;
            gap: 0.4rem;
        }

        .tag {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 30px;
            text-transform: capitalize;
            letter-spacing: 0.03em;
        }

        .tag-tone { background: rgba(124,92,252,0.8); color: #fff; }
        .tag-lang { background: rgba(0,214,143,0.8); color: #000; }

        /* ── CARD BODY ── */
        .card-body { padding: 1.2rem; flex: 1; display: flex; flex-direction: column; gap: 0.8rem; }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .desc-text {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.6);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .lyrics-toggle {
            font-size: 0.75rem;
            color: var(--accent);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .lyrics-box {
            display: none;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.65);
            line-height: 1.7;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.8rem;
            max-height: 160px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .lyrics-box.open { display: block; }

        /* ── AUDIO PLAYER ── */
        .audio-wrap { margin-top: auto; padding-top: 0.5rem; }

        audio {
            width: 100%;
            height: 36px;
            border-radius: 8px;
            outline: none;
        }

        audio::-webkit-media-controls-panel { background: rgba(124,92,252,0.15); }

        /* ── EMPTY / LOADER STATE ── */
        .state-box {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 2rem;
        }

        .state-box p { color: var(--muted); font-size: 1rem; margin-top: 1rem; }

        .spinner {
            width: 44px; height: 44px;
            border: 3px solid rgba(255,255,255,0.08);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── MODAL ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            z-index: 999;
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open { display: flex; }

        .modal-img {
            max-width: min(90vw, 700px);
            max-height: 90vh;
            border-radius: 16px;
            box-shadow: 0 0 80px rgba(124,92,252,0.3);
        }

        .modal-close {
            position: absolute;
            top: 1.5rem; right: 1.5rem;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 1.4rem;
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 640px) {
            .top-bar { padding: 1rem 1.2rem; }
            .hero, .filter-bar, .songs-grid, .stats-bar { padding-left: 1.2rem; padding-right: 1.2rem; }
            .hero h1 { font-size: 2rem; }
            .songs-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <nav class="top-bar">
        <div class="logo">✨ AI Content Studio</div>
        <div class="top-bar-actions">
            <span id="songCount" class="stat-chip"><span>—</span> items</span>
            <a href="index.html" class="btn btn-primary">✨ New Content</a>
        </div>
    </nav>

    <!-- HERO -->
    <div class="hero">
        <h1>Your Library</h1>
        <p>All your AI-generated content in one place</p>
    </div>

    <!-- FILTER BAR -->
    <div class="filter-bar" id="filterBar" style="display:none;">
        <button class="filter-btn active" data-filter="all">All</button>
    </div>

    <!-- GRID -->
    <div class="songs-grid" id="songsGrid">
        <div class="state-box">
            <div class="spinner"></div>
            <p>Loading your library...</p>
        </div>
    </div>

    <!-- IMAGE MODAL -->
    <div class="modal-overlay" id="imgModal">
        <button class="modal-close" id="modalClose">✕</button>
        <img class="modal-img" id="modalImg" src="" alt="Cover Art">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import CONFIG from './config.js';

        const supaClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        const grid       = document.getElementById('songsGrid');
        const filterBar  = document.getElementById('filterBar');
        const songCount  = document.getElementById('songCount').querySelector('span');
        const modal      = document.getElementById('imgModal');
        const modalImg   = document.getElementById('modalImg');

        document.getElementById('modalClose').addEventListener('click', () => modal.classList.remove('open'));
        modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

        function openImg(src) { modalImg.src = src; modal.classList.add('open'); }

        function toneEmoji(tone) {
            const map = { melancholic: '😢', romantic: '💕', energetic: '⚡', sad: '😔', happy: '🎉', chill: '😌', angry: '🔥' };
            return (map[tone?.toLowerCase()] || '🎶') + ' ' + (tone || 'Unknown');
        }

        function formatDate(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function buildCard(song) {
            const card = document.createElement('div');
            card.className = 'song-card';
            card.dataset.tone = (song.tone || 'other').toLowerCase();

            card.innerHTML = `
                <div class="card-cover" onclick="window.__openImg('${song.image_file}')">
                    <img src="${song.image_file || 'https://via.placeholder.com/400?text=No+Cover'}" 
                         alt="${song.topic}" loading="lazy"
                         onerror="this.src='https://via.placeholder.com/400?text=No+Cover'">
                    <div class="tag-row">
                        <span class="tag tag-tone">${toneEmoji(song.tone)}</span>
                        ${song.language ? `<span class="tag tag-lang">${song.language}</span>` : ''}
                    </div>
                    <div class="cover-overlay">
                        <button class="expand-icon">🔍 Full View</button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="card-title">${song.topic || 'Untitled'}</div>
                    <div class="card-meta">
                        <span>🗓 ${formatDate(song.created_at)}</span>
                        <span>🌐 ${song.language || 'Unknown'}</span>
                    </div>
                    ${song.description ? `<div class="desc-text" title="${song.description}">📝 ${song.description}</div>` : ''}
                    ${song.lyrics ? `
                        <button class="lyrics-toggle" onclick="this.nextElementSibling.classList.toggle('open'); const isOpen = this.nextElementSibling.classList.contains('open'); const type = this.closest('.song-card').querySelector('.card-title').textContent.includes('[') ? 'Script' : 'Lyrics'; this.textContent = isOpen ? '▲ Hide ' + type : '▼ Show ' + type;">
                            ▼ Show ${song.topic.includes('[') ? 'Script' : 'Lyrics'}
                        </button>
                        <div class="lyrics-box">${song.lyrics}</div>
                    ` : ''}
                    <div class="audio-wrap">
                        ${song.audio_file && song.audio_file.includes('.mp4') ? `
                        <video controls preload="none" style="width: 100%; border-radius: 8px; max-height: 250px;">
                            <source src="${song.audio_file}" type="video/mp4">
                        </video>
                        ` : `
                        <audio controls preload="none">
                            <source src="${song.audio_file}" type="audio/mpeg">
                        </audio>
                        `}
                    </div>
                </div>
            `;

            return card;
        }

        function buildFilters(songs) {
            const tones = [...new Set(songs.map(s => s.tone).filter(Boolean))];
            if (!tones.length) return;
            filterBar.style.display = 'flex';

            tones.forEach(tone => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.filter = tone.toLowerCase();
                btn.textContent = toneEmoji(tone);
                filterBar.appendChild(btn);
            });

            filterBar.addEventListener('click', e => {
                const btn = e.target.closest('.filter-btn');
                if (!btn) return;
                filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.dataset.filter;
                document.querySelectorAll('.song-card').forEach(card => {
                    card.style.display = (filter === 'all' || card.dataset.tone === filter) ? '' : 'none';
                });
            });
        }

        async function loadLibrary() {
            try {
                const { data, error } = await supaClient
                    .from('AudioSongs')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || !data.length) {
                    grid.innerHTML = `
                        <div class="state-box">
                            <div style="font-size: 3rem;">🎙️</div>
                            <p>Your library is empty.<br>Go generate your first piece of content!</p>
                            <a href="index.html" class="btn btn-primary" style="margin-top:1.5rem; display:inline-flex;">✨ Create Content</a>
                        </div>`;
                    return;
                }

                songCount.textContent = data.length;
                buildFilters(data);
                grid.innerHTML = '';
                data.forEach(song => grid.appendChild(buildCard(song)));

            } catch (err) {
                console.error(err);
                grid.innerHTML = `
                    <div class="state-box">
                        <div style="font-size: 2rem;">⚠️</div>
                        <p style="color:#ff7675;">Failed to load: ${err.message}</p>
                    </div>`;
            }
        }

        // expose to inline onclick
        window.__openImg = openImg;

        loadLibrary();
    </script>
</body>
</html>
