<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Studio</title>
  <!-- SEO metadata -->
  <meta name="description" content="Aman Aryan's personal project site with blog posts, investment tools, and analytics-driven resources.">
  <meta name="keywords" content="Aman Aryan, blog, investment analyzer, AI dashboard, portfolio, contact, privacy, disclaimer">
  <meta name="author" content="Aman Aryan">
  <meta name="robots" content="index, follow">
  <meta name="google-site-verification" content="YOUR_GOOGLE_SEARCH_CONSOLE_CODE">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SVF6G890F8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SVF6G890F8');
  </script>

    <meta name="description" content="Step-by-step AI generation for Songs, Cartoons, and Stories.">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="imageModal" class="modal">
        <img id="modalImage" src="" alt="Full Screen Preview">
    </div>

    <div class="container">
        <header>
            <h1>AI Content Studio</h1>
            <p>Your Multi-Modal Production Suite</p>

            <div class="mode-selector">
                <button class="mode-btn active" data-mode="song">🎵 Song Mode</button>
                <button class="mode-btn" data-mode="cartoon">🧸 Cartoon Mode</button>
                <button class="mode-btn" data-mode="story">📖 Story Mode</button>
            </div>

            <div style="display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem;">
                <button id="resetBtn" class="btn btn-reset" style="font-size: 0.8rem; padding: 0.5rem 1rem;">
                    <span>🧹 Reset All Data</span>
                </button>
                <a href="library.html" class="btn"
                    style="font-size: 0.8rem; padding: 0.5rem 1rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1);">
                    <span>📚 View Library</span>
                </a>
            </div>
        </header>

        <!-- STEP 1: INITIAL CONFIG -->
        <section id="step1" class="card">
            <div class="status-badge" id="step1Badge">Step 1: Configuration</div>
            <form id="textForm" class="form-grid">
                <div class="form-group">
                    <label>Title / Topic</label>
                    <input type="text" id="topic" placeholder="The Neon Rain" required>
                </div>
                <div class="form-group">
                    <label>Language</label>
                    <select id="language">
                        <option value="English">English</option>
                        <option value="Hindi">Hindi</option>
                        <option value="Spanish">Spanish</option>
                        <option value="French">French</option>
                        <option value="Punjabi">Punjabi</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tone</label>
                    <select id="tone">
                        <option value="melancholic">Melancholic</option>
                        <option value="energetic">Energetic</option>
                        <option value="romantic">Romantic</option>
                        <option value="funny">Funny</option>
                        <option value="scary">Scary</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label>Description</label>
                    <textarea id="description" placeholder="Describe your vision here..."></textarea>
                </div>
                <button type="submit" id="genTextBtn" class="btn full-width">
                    <span id="genTextBtnSpan">Generate Lyrics</span>
                    <div class="loader"></div>
                </button>
            </form>
        </section>

        <!-- STEP 2: EDIT TEXT -->
        <section id="step2" class="card step-section">
            <div class="status-badge" id="step2Badge">Step 2: Edit Content</div>
            <div id="textContent" class="read-only-wrapper">
                <textarea id="editableText" class="lyrics-editor"></textarea>
            </div>
            <div class="controls">
                <button type="button" id="confirmTextBtn" class="btn full-width">✅ Confirm & Proceed to Visuals</button>
                <div id="confirmedTextControls" style="display: none; gap: 0.5rem; width: 100%;">
                    <button type="button" id="editTextBtn" class="btn" style="flex: 1; background: #7f8c8d;">✏️ Edit
                        Again</button>
                    <button type="button" id="downloadTextBtn" class="btn" style="flex: 1; background: #34495e;">⬇️
                        Download Text</button>
                </div>
            </div>
        </section>

        <!-- STEP 3: VISUALS & MEDIA -->
        <section id="step3" class="card step-section">
            <div class="status-badge" id="step3Badge">Step 3: Production</div>
            <div class="preview-area">
                <img id="imagePreview"
                    src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                    class="image-preview" style="cursor: zoom-in; opacity: 0;">
                <div class="controls">
                    <button type="button" id="genImageBtn" class="btn">
                        <span id="genImageBtnSpan">🔄 Regenerate Visuals</span>
                        <div class="loader"></div>
                    </button>
                    <button type="button" id="downloadImageBtn" class="btn" style="display: none; background: #34495e;">
                        <span>⬇️ Download Visuals</span>
                    </button>

                    <div id="productionOptions" class="production-controls">
                        <button type="button" id="genMediaBtn" class="btn blurred-control">
                            <span id="genMediaBtnSpan">🎵 Generate AI Media</span>
                            <div class="loader"></div>
                        </button>

                        <audio id="audioPlayer" controls style="width: 100%; margin-top: 1rem; display: none;"></audio>
                        <video id="videoPlayer" controls
                            style="width: 100%; margin-top: 1rem; border-radius: 12px; display: none;"></video>

                        <button type="button" id="downloadMediaBtn" class="btn"
                            style="display: none; margin-top: 0.5rem; background: #34495e;">
                            <span>⬇️ Download Media</span>
                        </button>

                        <button type="button" id="saveBtn" class="btn full-width blurred-control"
                            style="background: #27ae60;">
                            <span>🚀 Save to Cloud Database</span>
                            <div class="loader"></div>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Status Monitor UI -->
        <div id="statusMonitor">
            <div class="status-item">
                <div class="status-dot pulse"></div>
                <div class="status-text" id="statusMsg">Initializing...</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="script.js"></script>
</body>

</html>
